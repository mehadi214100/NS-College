<style>
/* Layout: one big square preview with a thumbnail strip beneath (product-gallery style), then photo, batch and download. Two columns on desktop, one column on phones. */
:root {
  --bg: #F1F5EF;
  --surface: #FFFFFF;
  --surface-2: #E6EEE4;
  --ink: #10281D;

  :root:not([data-theme="light"]) {

    --line: #25402F; --accent: #4CC98A; --on-accent: #05221A; --focus: #8FB0FF;

}

  --bg: #09150F; --surface: #10211A; --surface-2: #173026; --ink: #EAF3EC; --muted: #9BB3A5;
  --line: #25402F; --accent: #4CC98A; --on-accent: #05221A; --focus: #8FB0FF;

}
* { box-sizing: border-box; }

  background: var(--bg); color: var(--ink);
  font: 400 16px/1.55 var(--font-ui);
  padding-block: 6px 40px;

  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1120px; margin-inline: auto; }

.top { display: flex; align-items: center; gap: 12px; padding-block: 12px 6px; }
.top img { width: 54px; height: 54px; border-radius: 50%; flex: none; box-shadow: var(--shadow); background: #fff; }
.top > div { min-width: 0; }
.eyebrow { font: 600 12.5px/1.35 var(--font-ui); color: var(--muted); margin: 0; }
h1 { font: 800 clamp(23px, 5.6vw, 38px)/1.15 var(--font-display); margin: 1px 0 0; text-wrap: balance; }
.lead { color: var(--muted); max-width: 60ch; margin: 4px 0 14px; font-size: 15px; }

main { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 36px; align-items: start; }
.stage { position: sticky; top: 16px; min-width: 0; }
.stage-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 8px; box-shadow: var(--shadow); }
.view { position: relative; }
#stage { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 12px; background: #fff; touch-action: pan-y; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.has-photo #stage { touch-action: none; cursor: grab; }
.has-photo #stage.grabbing { cursor: grabbing; }
.pick { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 8px; min-height: 50px; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 700 17px var(--font-display); box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28); cursor: pointer; white-space: nowrap; }

.change { position: absolute; right: 12px; top: 33%; padding: 8px 16px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 700 14px var(--font-ui); cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.chip.off { opacity: 0; }

.stripHead { font: 700 15px var(--font-display); margin: 14px 2px 8px; }

.controls { min-width: 0; }
.step { padding-block: 18px; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; padding-top: 4px; }
.step h2 { font: 700 18px/1.3 var(--font-display); margin: 0 0 10px; }

.drop { position: relative; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 16px; border: 2px dashed var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; }

.drop > span { min-width: 0; }

.drop small { display: block; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }

.note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.field input { width: 100%; min-height: 54px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 20px; }
.field input:focus-visible { border-color: var(--accent); }

.dl { width: 100%; min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font: 700 19px var(--font-display); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.dl:disabled { opacity: 0.45; cursor: not-allowed; }
.dl:not(:disabled):hover { filter: brightness(1.06); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(92vw, 460px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; box-shadow: var(--shadow); z-index: 30; text-align: center; }
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(5, 20, 12, 0.8); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet .box { background: var(--surface); border-radius: 16px; padding: 12px; max-width: 640px; width: 100%; display: flex; flex-direction: column; gap: 10px; max-height: 100%; overflow: auto; }
.sheet img { width: 100%; height: auto; border-radius: 10px; display: block; -webkit-touch-callout: default; }
.sheet .close { min-height: 48px; padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }

@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .stage { position: static; }
}
@media (max-width: 480px) {
  .stage-card { padding: 6px; border-radius: 16px; }
  .strip { gap: 6px; }
  .frame { padding: 3px 3px 5px; border-radius: 10px; }
  .frame span { font-size: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .frame, .drop, .dl { transition: border-color 0.15s, background 0.15s, box-shadow 0.15s; }
}
</style>

      </div>
          </section>

    <div class="controls">

<script>
(function () {
'use strict';
var $pv = false, AF = window.AF, raw = window.FRAME_CONFIG, SET = window.FRAME_SETTINGS || {}, remote = Promise.resolve(null);

function imgH(i) { return i.naturalHeight || i.height; }
function draw(c, s) { AF.render(c, CFG, s); }
/* ---------- state + UI ---------- */

var $ = function (id) { return document.getElementById(id); };

function toBn(s) { return String(s).replace(/[0-9]/g, function (d) { return BD[d]; }); }
function toEn(s) { return String(s).replace(/[০-৯]/g, function (d) { return BD.indexOf(d); }); }

function renderThumbs() {}
function placePick() {

function selectFrame(i) {

  schedule(false);
}
var HINT = TOUCH ? 'আঙুলে টেনে সরান · দুই আঙুলে জুম' : 'টেনে সরান · স্ক্রল করে জুম';

  $('download').disabled = !has;

  $('dlNote').textContent = has ? 'ফেসবুকের জন্য ' + toBn(OUT) + ' × ' + toBn(OUT) + ' পিক্সেলের স্কয়ার JPG হবে।' : 'আগে ছবি যোগ করুন, তারপর ডাউনলোড চালু হবে।';
}

/* photo loading, downscaled once so dragging stays smooth */

$('file').addEventListener('change', function (e) { loadFile(e.target.files[0]); e.target.value = ''; });
['dragover', 'dragenter'].forEach(function (ev) {

/* drag, pinch, wheel, keys: all directly on the photo */

  if (m) { e.preventDefault(); nudge(m); }
  else if (e.key === '+' || e.key === '=') { e.preventDefault(); setZoom(st.zoom + 0.1); schedule(true); }
  else if (e.key === '-') { e.preventDefault(); setZoom(st.zoom - 0.1); schedule(true); }
});

/* download */
var DL = null;
(function () {
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { DL = d; }, function () { DL = null; }); } catch (e) { DL = null; }
})();
function fileName() {
  return (PG.prefix || 'alumni-frame') + '.jpg';
}
$('download').addEventListener('click', function () {
  if (!st.img) { toast('আগে ছবি যোগ করুন।'); return; }
  var btn = $('download'); btn.disabled = true;
  var out = document.createElement('canvas'); out.width = OUT; out.height = OUT;
  var oc = out.getContext('2d'); oc.scale(OUT / W, OUT / H);
  draw(oc, { img: st.img, zoom: st.zoom, ox: st.ox, oy: st.oy });
  out.toBlob(function (blob) {
    btn.disabled = false;
    if (!blob) { toast('ছবি তৈরি করা যায়নি। আবার চেষ্টা করুন।'); return; }
    var name = fileName();
    if (DL) {
      DL.save({ filename: name, data: blob }).then(function () { toast('ছবি সেভ হয়েছে।'); }, function (err) {
        if (err && err.code === 'declined') return;
        if (err && err.code === 'rate_limited') { toast('একটু পরে আবার চাপুন।'); return; }
        showSheet(blob);
      });
    } else {
      var u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      showSheet(blob);
    }
  }, 'image/jpeg', 0.93);
});
function showSheet(blob) {
  var u = URL.createObjectURL(blob); $('sheetImg').src = u; $('sheet').hidden = false; $('sheetClose').focus();
}
$('sheetClose').addEventListener('click', function () { $('sheet').hidden = true; });
$('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) $('sheet').hidden = true; });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('sheet').hidden = true; });

function start() {
applyPage(); AF.onload = function () { schedule(true); };
$('title').textContent = PG.title; $('eyebrow').textContent = PG.eyebrow; document.title = PG.title;
$('dropSub').textContent = PG.upload;
var hl = AF.normalize(CFG).elements.filter(function (e) { return e.type === 'image'; })[0];
$('hdrLogo').src = hl && hl.src ? hl.src : AF.logoSrc();
if ($pv) $('pv').hidden = false;
sync(); selectFrame(0); AF.fonts(CFG).then(function () { schedule(true); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { schedule(true); });
}
remote.then(function (r) { if (r && r.elements) { CFG = AF.normalize(r); PG = CFG.page; OUT = +PG.out || 2048; } start(); });
})();
</script>
