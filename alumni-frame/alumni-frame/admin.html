 return AF.dbPut(SET.db,'frame',cfg).then(function(){dirty=false;say('✅ সেভ হয়েছে! সবাই এখন নতুন ফ্রেম দেখবে। <a href="index.html" target="_blank">ইউজার পেজে দেখুন</a>')},function(){say('❌ সেভ হয়নি। ইন্টারনেট বা ডাটাবেস সেটিং দেখুন।');return Promise.reject()})}
$('bSave').onclick=function(){say('সেভ হচ্ছে…');pub2().catch(function(){})};
$('adv').onchange=function(){adv=this.checked;$('adx').hidden=!adv;build()};
$('bImp').onclick=function(){$('fImp').click()};$('fImp').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var t=r.result;cfg=AF.normalize(JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1)));sel=null;build();draw();save()}catch(e){alert('ফাইলটি পড়া যায়নি')}};r.readAsText(f)};
$('bRes').onclick=function(){if(confirm('সব পরিবর্তন বাদ দিয়ে প্রথম (মূল) ডিজাইনে ফিরবেন?')){cfg=AF.normalize(AF.DEFAULT);sel=null;dirty=true;build();draw();if(SET.db&&confirm('মূল ডিজাইন এখনই সবার জন্য প্রকাশ করবেন?'))pub2().catch(function(){});else say('মূল ডিজাইন লোড হয়েছে। প্রকাশ করতে "সেভ ও প্রকাশ" চাপুন।')}};
window.onresize=box;AF.onload=draw;
function init(){$('gate').hidden=true;var p=SET.db?AF.dbGet(SET.db,'frame'):Promise.resolve(null);p.then(function(r){if(r&&r.elements)cfg=AF.normalize(r);build();draw();AF.fonts(cfg).then(draw)})}
function login(){var v=$('pw').value;SET.db&&AF.dbGet(SET.db,'auth').then(function(a){return a}).then(chk)||chk();
 function chk(a){AF.sha(v).then(function(h){if(h===(typeof a=='string'?a:SET.pw)){try{sessionStorage.setItem('af_ok','1')}catch(e){}init()}else $('pwm').textContent='পাসওয়ার্ড ভুল'})}}
$('pwb').onclick=login;$('pw').onkeydown=function(e){if(e.key=='Enter')login()};
try{if(sessionStorage.getItem('af_ok')){init()}}catch(e){}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
})();
</script></body></html>
